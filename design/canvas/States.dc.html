@keyframes tsSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.ts-lift{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}

.ts-tile{transition:transform .25s ease,box-shadow .25s ease}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}

<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["uk","en"],"default":"uk","section":"Мова / Language"},"$preview":{"width":1440,"height":460}}'>
const T = {"uk": {"lang_group": "Мова інтерфейсу", "tier_word": "рівень даних", "tier_A": "Повні дані", "tier_B": "Базові дані", "tier_C": "Оцінка", "close": "Закрити", "title": "Стани інтерфейсу", "sub": "Однакові на всіх екранах: колір і текст кажуть, що сталося і що робити далі.", "l1": "Завантаження", "l1s": "Скелет повторює форму картки — сторінка не стрибає.", "l2": "Помилка джерела", "l2s": "Кажемо, що саме не вдалося, що показуємо натомість і як повторити.", "e_t": "Півот 21: NASA POWER не відповів", "e_b": "Показуємо вчорашні дані від 13 листопада, 06:00.", "retry": "Повторити", "l3": "Успіх", "l3s": "Підтвердження з можливістю скасувати 8 секунд.", "s_t": "Смуга «Північ» · додано у звіт власнику", "undo": "Скасувати", "l4": "Немає зв'язку", "l4s": "Після хакатону (P1): нічого не губиться, чернетка чекає на телефоні.", "o_t": "Немає інтернету", "o_b": "Огляд Півота 14 збережено. Надішлемо, щойно з'явиться зв'язок.", "l5": "Порожньо", "l5s": "Перший запуск — окремий екран «Головна до першого поля».", "open": "Відкрити"}, "en": {"lang_group": "Interface language", "tier_word": "data tier", "tier_A": "Full data", "tier_B": "Core data", "tier_C": "Estimated", "close": "Close", "title": "Interface states", "sub": "The same on every screen: colour and text say what happened and what to do next.", "l1": "Loading", "l1s": "The skeleton keeps the card's shape, so the page doesn't jump.", "l2": "Source error", "l2s": "Say what failed, what we show instead and how to retry.", "e_t": "Pivot 21: NASA POWER didn't respond", "e_b": "Showing yesterday's data from 13 November, 06:00.", "retry": "Retry", "l3": "Success", "l3s": "Confirmation with 8 seconds to undo.", "s_t": "North strip · added to the owner report", "undo": "Undo", "l4": "Offline", "l4s": "After the hackathon (P1): nothing is lost, the draft waits on the phone.", "o_t": "No internet", "o_b": "The Pivot 14 check is saved. We'll send it once you're back online.", "l5": "Empty", "l5s": "First run is its own screen, “Home before the first field”.", "open": "Open"}};
class Component extends DCLogic {
  constructor(props) {

  }

  componentDidMount() {
    const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { this.setState({ p: 1, reduce: true }); if (this.afterIntro) this.afterIntro(true); return; }

    const tick = (now) => {
      const k = Math.min(1, (now - t0) / 1500);
      this.setState({ p: k });

    this._raf = requestAnimationFrame(tick);

  }

    const seg = (on) => "min-width: 52px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; " +

    const v = {
      t, lang,
      setUk: () => this.setState({ lang: "uk" }),
      setEn: () => this.setState({ lang: "en" }),

      ukStyle: seg(lang === "uk"), enStyle: seg(lang === "en"),
    };

    const p = this.state.p == null ? 0 : this.state.p;
    const ease = 1 - Math.pow(1 - p, 3);
    const loc = lang === "uk" ? "uk-UA" : "en-US";
    const nf = (x, d) => Number(x).toLocaleString(loc, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
    const cu = (x, d) => nf(x * ease, d);


    return v;
  }
}
