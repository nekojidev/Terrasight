<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Terrasight — create your company</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F3EE}
a{color:#191714}a:hover{color:#000000}

@keyframes tsPage{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes tsUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes tsFade{from{opacity:0}to{opacity:1}}
@keyframes tsGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tsGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tsDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tsPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tsPulse{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes tsSpin{to{transform:rotate(360deg)}}
@keyframes tsSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ts-page{animation:tsPage .5s cubic-bezier(.2,.7,.2,1) both}
.ts-up{animation:tsUp .65s cubic-bezier(.2,.7,.2,1) both}
.ts-fade{animation:tsFade .8s ease both}
.ts-grow{transform-origin:50% 100%;transform-box:fill-box;animation:tsGrow .9s cubic-bezier(.2,.7,.2,1) both}
.ts-growx{transform-origin:0 50%;animation:tsGrowX 1s cubic-bezier(.2,.7,.2,1) both}
.ts-draw{stroke-dasharray:1;animation:tsDraw 1.8s cubic-bezier(.3,.6,.2,1) both}
.ts-pop{animation:tsPop .5s cubic-bezier(.2,.7,.2,1) both}
.ts-pulse{animation:tsPulse 1.8s ease-out infinite}
.ts-spin{animation:tsSpin 1.1s linear infinite;transform-origin:50% 50%}
.ts-sway{transform-origin:50% 100%;transform-box:fill-box;animation:tsSway 3.2s ease-in-out infinite}
.ts-lift{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.ts-lift:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(25,23,20,.09)}
.ts-btn{transition:background-color .15s ease,transform .1s ease,box-shadow .15s ease}
.ts-btn:hover{box-shadow:0 4px 14px rgba(25,23,20,.22)}
.ts-btn:active{transform:scale(.98)}
.ts-tile{transition:transform .25s ease,box-shadow .25s ease}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</helmet>
<div class="ts-page" style="min-height: 900px; background: #F5F3EE; color: #191714; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 24px; display: flex; flex-direction: column; align-items: center; padding: 40px 24px">
<div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 28 28" style="flex: none"><rect width="28" height="28" rx="8" fill="#191714"></rect><circle cx="13" cy="15" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="2"></circle><path d="M7.2 13.2 Q13 16.5 18.8 13.2" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.7"></path><path d="M4.5 19.5 A 11 6 -25 0 1 23.5 8.5" fill="none" stroke="#99F6E4" stroke-width="1.6" stroke-linecap="round"></path><circle cx="23.5" cy="8.5" r="2" fill="#FFFFFF"></circle></svg><span style="font-size: 20px; font-weight: 700">Terrasight</span>
<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: #4F4A43">{{t.step}} {{stepN}} {{t.of2}}<span style="width: 40px; height: 6px; border-radius: 3px; background: {{d0}}; transition: background-color .3s ease"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: {{d1}}; transition: background-color .3s ease"></span></span></div>
<div style="padding: 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E6E1D6; box-shadow: 0 1px 2px rgba(25,23,20,0.05), 0 4px 16px rgba(25,23,20,0.04)"><sc-if value="{{isS1}}" hint-placeholder-val="true"><div class="ts-up" style="display: flex; flex-direction: column; gap: 18px">
<div><h1 style="margin: 0; font-size: 30px; line-height: 38px">{{t.s1t}}</h1><p style="margin: 6px 0 0; color: #4F4A43">{{t.s1s}}</p></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.name}}<input type="text" value="Prairie Field Co." style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFC8BA; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; color: #191714; outline: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.tz}}<div style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFC8BA; font-size: 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF"><span>{{t.tz_v}}</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M7 4 L13 10 L7 16"></path></svg></div><span style="font-size: 14px; font-weight: 400; color: #4F4A43">{{t.tz_h}}</span></label>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.units}}<div style="display: flex; gap: 8px"><button onClick="{{setU0}}" aria-pressed="{{u0On}}" style="flex: 1; min-height: 48px; border-radius: 12px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; border: 1.5px solid {{u0Bd}}; background: {{u0Bg}}; color: #191714">{{t.u_ha}}</button><button onClick="{{setU1}}" aria-pressed="{{u1On}}" style="flex: 1; min-height: 48px; border-radius: 12px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; border: 1.5px solid {{u1Bd}}; background: {{u1Bg}}; color: #191714">{{t.u_ac}}</button></div></div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600">{{t.lang}}<span style="margin-left: auto"><div role="group" aria-label="{{t.lang_group}}" style="display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: #F5F3EE; border: 1px solid #E6E1D6"><button class="ts-btn" onClick="{{setUk}}" aria-pressed="{{ukOn}}" style="{{ukStyle}}">UA</button><button class="ts-btn" onClick="{{setEn}}" aria-pressed="{{enOn}}" style="{{enStyle}}">EN</button></div></span></div>
<button onClick="{{toS2}}" class="ts-btn" style="min-height: 56px; border-radius: 14px; border: 0; background: #191714; color: #FFFFFF; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer">{{t.next}} →</button></div></sc-if><sc-if value="{{isS2}}" hint-placeholder-val="false"><div class="ts-up" style="display: flex; flex-direction: column; gap: 18px">
<div><h1 style="margin: 0; font-size: 30px; line-height: 38px">{{t.s2t}}</h1><p style="margin: 6px 0 0; color: #4F4A43">{{t.s2s}}</p></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.email}}<input type="email" value="john@prairiefield.co" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFC8BA; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; color: #191714; outline: none"></label>
<div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; background: #FAF8F4; border: 1px solid #E6E1D6"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#191714" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 10 C 4.5 5.5 7 4 10 4 C 13 4 15.5 5.5 18 10 C 15.5 14.5 13 16 10 16 C 7 16 4.5 14.5 2 10 Z"></path><circle cx="10" cy="10" r="2.6"></circle></svg><div><div style="font-weight: 600">{{t.role}}</div><div style="font-size: 14px; color: #4F4A43">{{t.role_s}}</div></div></div>
<div style="display: flex; gap: 10px"><button onClick="{{toS1}}" style="min-height: 56px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #CFC8BA; background: #FFFFFF; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">{{t.back}}</button>
<a href="EmptyHome.dc.html" style="min-height: 56px; padding: 0 18px; border-radius: 14px; display: inline-flex; align-items: center; font-size: 16px; font-weight: 600; color: #4F4A43; text-decoration: none">{{t.skip}}</a>
<a href="EmptyHome.dc.html" class="ts-btn" style="flex: 1; min-height: 56px; border-radius: 14px; background: #191714; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center">{{t.invite}}</a></div>
<p style="margin: 0; font-size: 14px; color: #6B645A">{{t.later}}</p></div></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["uk","en"],"default":"uk","section":"Мова / Language"},"$preview":{"width":1440,"height":900}}'>
const T = {"uk": {"lang_group": "Мова інтерфейсу", "tier_word": "рівень даних", "tier_A": "Повні дані", "tier_B": "Базові дані", "tier_C": "Оцінка", "close": "Закрити", "step": "Крок", "of2": "з 2", "s1t": "Ваша компанія", "s1s": "Усі поля компанії будуть в одному місці, навіть якщо вони в різних штатах.", "name": "Назва компанії", "tz": "Часовий пояс", "tz_v": "Америка / Чикаго (UTC−6) — визначено автоматично", "tz_h": "О 06:00 за цим часом Terrasight щоранку перевірятиме всі поля.", "units": "Одиниці", "u_ha": "Гектари, °C, мм", "u_ac": "Акри, °F, дюйми", "lang": "Мова звітів для власника", "next": "Далі", "s2t": "Запросіть власника або менеджера", "s2s": "Він бачитиме лише звіт: що зробити на полях і чому. Відповідає одним дотиком — Зроблено, Ще ні або Питання.", "email": "Email або телефон", "role": "Роль: Читач", "role_s": "Без доступу до налаштувань і асистента", "skip": "Пропустити", "invite": "Запросити й продовжити", "back": "Назад", "later": "Запросити можна й пізніше на сторінці «Звіти»."}, "en": {"lang_group": "Interface language", "tier_word": "data tier", "tier_A": "Full data", "tier_B": "Core data", "tier_C": "Estimated", "close": "Close", "step": "Step", "of2": "of 2", "s1t": "Your company", "s1s": "All of the company's fields live in one place, even across states.", "name": "Company name", "tz": "Time zone", "tz_v": "America / Chicago (UTC−6) — detected automatically", "tz_h": "Terrasight checks every field at 06:00 in this time zone each morning.", "units": "Units", "u_ha": "Hectares, °C, mm", "u_ac": "Acres, °F, inches", "lang": "Language of owner reports", "next": "Next", "s2t": "Invite the owner or manager", "s2s": "They only see the report: what to do on the fields and why. They reply with one tap — Done, Not yet or Question.", "email": "Email or phone", "role": "Role: Viewer", "role_s": "No access to settings or the assistant", "skip": "Skip", "invite": "Invite and continue", "back": "Back", "later": "You can also invite later on the Reports page."}};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, p: 0, s: 1, u: 0 };
  }

  componentDidMount() {
    const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { this.setState({ p: 1, reduce: true }); if (this.afterIntro) this.afterIntro(true); return; }
    const t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / 1500);
      this.setState({ p: k });
      if (k < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
    if (this.afterIntro) this.afterIntro(false);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearInterval(this._iv); clearTimeout(this._to); }


  renderVals() {
    const lang = this.state.lang || this.props.lang || "uk";
    const t = T[lang];
    const seg = (on) => "min-width: 52px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; " +
      (on ? "background: #FFFFFF; color: #191714; box-shadow: 0 1px 3px rgba(25,23,20,0.14)" : "background: transparent; color: #4F4A43");
    const v = {
      t, lang,
      setUk: () => this.setState({ lang: "uk" }),
      setEn: () => this.setState({ lang: "en" }),
      ukOn: lang === "uk" ? "true" : "false", enOn: lang === "en" ? "true" : "false",
      ukStyle: seg(lang === "uk"), enStyle: seg(lang === "en"),
    };

    const p = this.state.p == null ? 0 : this.state.p;
    const ease = 1 - Math.pow(1 - p, 3);
    const loc = lang === "uk" ? "uk-UA" : "en-US";
    const nf = (x, d) => Number(x).toLocaleString(loc, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
    const cu = (x, d) => nf(x * ease, d);


    const s = this.state.s || 1, u = this.state.u || 0;
    v.isS1 = s === 1; v.isS2 = s === 2; v.stepN = s;
    v.toS2 = () => this.setState({ s: 2 }); v.toS1 = () => this.setState({ s: 1 });
    v.d0 = "#191714"; v.d1 = s === 2 ? "#191714" : "#E6E1D6";
    for (let i = 0; i < 2; i++) { v["u" + i + "On"] = String(u === i); v["u" + i + "Bd"] = u === i ? "#191714" : "#CFC8BA"; v["u" + i + "Bg"] = u === i ? "#EFEBE3" : "#FFFFFF"; v["setU" + i] = () => this.setState({ u: i }); }

    return v;
  }
}
</script>
</body>
</html>
