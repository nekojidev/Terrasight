<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Terrasight — sign in</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F3EE}
a{color:#191714}a:hover{color:#000000}

@keyframes tsPage{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes tsUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes tsFade{from{opacity:0}to{opacity:1}}
@keyframes tsGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tsGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tsDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tsPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tsPulse{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes tsSpin{to{transform:rotate(360deg)}}
@keyframes tsSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ts-page{animation:tsPage .5s cubic-bezier(.2,.7,.2,1) both}
.ts-up{animation:tsUp .65s cubic-bezier(.2,.7,.2,1) both}
.ts-fade{animation:tsFade .8s ease both}
.ts-grow{transform-origin:50% 100%;transform-box:fill-box;animation:tsGrow .9s cubic-bezier(.2,.7,.2,1) both}
.ts-growx{transform-origin:0 50%;animation:tsGrowX 1s cubic-bezier(.2,.7,.2,1) both}
.ts-draw{stroke-dasharray:1;animation:tsDraw 1.8s cubic-bezier(.3,.6,.2,1) both}
.ts-pop{animation:tsPop .5s cubic-bezier(.2,.7,.2,1) both}
.ts-pulse{animation:tsPulse 1.8s ease-out infinite}
.ts-spin{animation:tsSpin 1.1s linear infinite;transform-origin:50% 50%}
.ts-sway{transform-origin:50% 100%;transform-box:fill-box;animation:tsSway 3.2s ease-in-out infinite}
.ts-lift{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.ts-lift:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(25,23,20,.09)}
.ts-btn{transition:background-color .15s ease,transform .1s ease,box-shadow .15s ease}
.ts-btn:hover{box-shadow:0 4px 14px rgba(25,23,20,.22)}
.ts-btn:active{transform:scale(.98)}
.ts-tile{transition:transform .25s ease,box-shadow .25s ease}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</helmet>
<div class="ts-page" style="display: flex; min-height: 900px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #191714; background: #F5F3EE">
<div style="flex: 1 1 0; background: #191714; color: #FFFFFF; padding: 48px 56px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 28 28" style="flex: none"><rect width="28" height="28" rx="8" fill="#191714"></rect><circle cx="13" cy="15" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="2"></circle><path d="M7.2 13.2 Q13 16.5 18.8 13.2" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.7"></path><path d="M4.5 19.5 A 11 6 -25 0 1 23.5 8.5" fill="none" stroke="#99F6E4" stroke-width="1.6" stroke-linecap="round"></path><circle cx="23.5" cy="8.5" r="2" fill="#FFFFFF"></circle></svg><span style="font-size: 22px; font-weight: 700">Terrasight</span></div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center"><svg role="img" aria-label="{{t.art}}" viewBox="0 0 560 460" style="width: 100%; max-width: 560px; height: auto; display: block"><g class="ts-pop" style="animation-delay: 200ms; transform-origin: 150px 150px"><circle cx="150" cy="150" r="90" fill="#F2C230" opacity=".92"></circle><path class="ts-draw" pathLength="1" stroke-dasharray="1" d="M150 150 L222 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8" style="animation-delay: 500ms"></path></g><g class="ts-pop" style="animation-delay: 340ms; transform-origin: 340px 130px"><circle cx="340" cy="130" r="74" fill="#B7791F" opacity=".92"></circle><path class="ts-draw" pathLength="1" stroke-dasharray="1" d="M340 130 L399 89" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8" style="animation-delay: 640ms"></path></g><g class="ts-pop" style="animation-delay: 480ms; transform-origin: 230px 335px"><circle cx="230" cy="335" r="96" fill="#7C5CDB" opacity=".92"></circle><path class="ts-draw" pathLength="1" stroke-dasharray="1" d="M230 335 L307 282" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8" style="animation-delay: 780ms"></path></g><g class="ts-pop" style="animation-delay: 620ms; transform-origin: 430px 300px"><circle cx="430" cy="300" r="70" fill="#22A06B" opacity=".92"></circle><path class="ts-draw" pathLength="1" stroke-dasharray="1" d="M430 300 L486 262" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".8" style="animation-delay: 920ms"></path></g><circle class="ts-pulse" cx="340" cy="130" r="10" fill="#FFFFFF"></circle></svg></div>
<h1 class="ts-up" style="margin: 0; font-size: 40px; line-height: 48px; letter-spacing: -0.02em; max-width: 560px">{{t.tag}}</h1>
<p class="ts-up" style="animation-delay: 100ms; margin: 0; font-size: 18px; line-height: 27px; color: #CFC8BA; max-width: 520px">{{t.tag_s}}</p>
<div class="ts-up" style="animation-delay: 200ms; display: flex; gap: 10px; flex-wrap: wrap"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#C8F169" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 6 L3 3 L6 3 M14 3 L17 3 L17 6 M17 14 L17 17 L14 17 M6 17 L3 17 L3 14"></path><circle cx="10" cy="10" r="3.5"></circle></svg>{{t.b1}}</span><span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#C8F169" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M10 2 L16 4.5 L16 10 C 16 14 13 16.5 10 18 C 7 16.5 4 14 4 10 L4 4.5 Z"></path><path d="M7 10 L9.2 12.2 L13 8.2"></path></svg>{{t.b2}}</span><span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#C8F169" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M4 10 L8 14 L16 6"></path></svg>{{t.b3}}</span></div></div>
<div style="flex: 0 0 560px; display: flex; flex-direction: column; padding: 32px 64px">
<div style="align-self: flex-end"><div role="group" aria-label="{{t.lang_group}}" style="display: inline-flex; gap: 2px; padding: 4px; border-radius: 12px; background: #F5F3EE; border: 1px solid #E6E1D6"><button class="ts-btn" onClick="{{setUk}}" aria-pressed="{{ukOn}}" style="{{ukStyle}}">UA</button><button class="ts-btn" onClick="{{setEn}}" aria-pressed="{{enOn}}" style="{{enStyle}}">EN</button></div></div>
<form class="ts-up" style="animation-delay: 150ms; margin: auto 0; display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0 0 6px; font-size: 32px; line-height: 40px">{{t.title}}</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.email}}<input type="email" value="olena@prairiefield.co" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFC8BA; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; color: #191714; outline: none"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600">{{t.pass}}<input type="password" value="••••••••••" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #CFC8BA; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; color: #191714; outline: none"></label>
<a href="#" style="align-self: flex-end; margin-top: -6px; font-size: 15px; font-weight: 600; color: #191714; text-decoration: none">{{t.forgot}}</a>
<a class="ts-btn" href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 24px; border-radius: 14px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; box-sizing: border-box; background: #191714; color: #FFFFFF; border: 0; width: 100%"><span>{{t.go}}</span></a>
<p style="margin: 6px 0 0; text-align: center; color: #4F4A43">{{t.noacc}} <a href="Onboarding.dc.html" style="color: #191714; font-weight: 600; text-decoration: none">{{t.create}}</a></p></form>
<p style="margin: 0; text-align: center; font-size: 13px; color: #6B645A">{{t.data}}</p></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["uk","en"],"default":"uk","section":"Мова / Language"},"$preview":{"width":1440,"height":900}}'>
const T = {"uk": {"lang_group": "Мова інтерфейсу", "tier_word": "рівень даних", "tier_A": "Повні дані", "tier_B": "Базові дані", "tier_C": "Оцінка", "close": "Закрити", "tag": "Що зробити на полях сьогодні — і чому.", "tag_s": "Не ще одна карта NDVI: щоранку — список справ по всіх полях, кожна з доказами. Без реклами препаратів.", "b1": "Щоранку перевіряє всі поля", "b2": "Пояснює кожну пораду даними", "b3": "Без реклами препаратів", "title": "Вхід", "email": "Email", "pass": "Пароль", "forgot": "Забули пароль?", "go": "Увійти", "noacc": "Немає акаунта?", "create": "Створити компанію", "data": "Відкриті дані NASA, USDA та ESA", "art": "Ілюстрація: поле з колами поливу"}, "en": {"lang_group": "Interface language", "tier_word": "data tier", "tier_A": "Full data", "tier_B": "Core data", "tier_C": "Estimated", "close": "Close", "tag": "What to do on your fields today — and why.", "tag_s": "Not another NDVI map: every morning, a to-do list across all your fields, each with evidence. No product ads.", "b1": "Checks every field each morning", "b2": "Explains every tip with data", "b3": "No product ads", "title": "Sign in", "email": "Email", "pass": "Password", "forgot": "Forgot password?", "go": "Sign in", "noacc": "No account?", "create": "Create a company", "data": "Open data from NASA, USDA and ESA", "art": "Illustration: a field with pivot circles"}};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, p: 0 };
  }

  componentDidMount() {
    const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { this.setState({ p: 1, reduce: true }); if (this.afterIntro) this.afterIntro(true); return; }
    const t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / 1500);
      this.setState({ p: k });
      if (k < 1) this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
    if (this.afterIntro) this.afterIntro(false);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearInterval(this._iv); clearTimeout(this._to); }


  renderVals() {
    const lang = this.state.lang || this.props.lang || "uk";
    const t = T[lang];
    const seg = (on) => "min-width: 52px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; " +
      (on ? "background: #FFFFFF; color: #191714; box-shadow: 0 1px 3px rgba(25,23,20,0.14)" : "background: transparent; color: #4F4A43");
    const v = {
      t, lang,
      setUk: () => this.setState({ lang: "uk" }),
      setEn: () => this.setState({ lang: "en" }),
      ukOn: lang === "uk" ? "true" : "false", enOn: lang === "en" ? "true" : "false",
      ukStyle: seg(lang === "uk"), enStyle: seg(lang === "en"),
    };

    const p = this.state.p == null ? 0 : this.state.p;
    const ease = 1 - Math.pow(1 - p, 3);
    const loc = lang === "uk" ? "uk-UA" : "en-US";
    const nf = (x, d) => Number(x).toLocaleString(loc, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
    const cu = (x, d) => nf(x * ease, d);


    return v;
  }
}
</script>
</body>
</html>
